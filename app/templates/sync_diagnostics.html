{% extends "base.html" %}

{% block content %}
<div class="card">
  <h2>Sync Diagnostics</h2>
  <table>
    <tr><th>Check</th><th>Value</th></tr>
    {% for key, value in checks.items() %}
    <tr>
      <td>{{ key }}</td>
      <td>{{ value }}</td>
    </tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
